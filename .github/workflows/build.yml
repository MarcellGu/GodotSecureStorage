name: Build, E2E, and release
on: { push: { branches: [ main ], tags: [ "v*" ] }, pull_request: { }, workflow_dispatch: { } }
permissions: { actions: write, contents: read }
concurrency:
  group: secure-storage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    outputs: { run_heavy: "${{ steps.changes.outputs.run_heavy }}" }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { fetch-depth: 0, persist-credentials: false }
      - id: changes
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then git diff --quiet "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" -- . ':(exclude)README.md' ':(exclude)LICENSE' ':(exclude)docs/**' && echo run_heavy=false || echo run_heavy=true
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ] && [ "${{ github.event.before }}" != 0000000000000000000000000000000000000000 ]; then git diff --quiet "${{ github.event.before }}...${{ github.sha }}" -- . ':(exclude)README.md' ':(exclude)LICENSE' ':(exclude)docs/**' && echo run_heavy=false || echo run_heavy=true
          else echo run_heavy=true; fi >>"$GITHUB_OUTPUT"
      - id: ci-tools-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-tool-archives
          key: secure-storage-ci-tools-actionlint-1.7.12-shellcheck-0.10.0-linux
      - id: ci_tools_setup
        run: ./.github/scripts/setup-ci.sh
        env:
          CACHE_KEY: secure-storage-ci-tools-actionlint-1.7.12-shellcheck-0.10.0-linux
          CACHE_HIT: ${{ steps.ci-tools-cache.outputs.cache-hit }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      - if: steps.ci_tools_setup.outputs.cache_invalidated == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-tool-archives
          key: secure-storage-ci-tools-actionlint-1.7.12-shellcheck-0.10.0-linux
      - run: shellcheck --shell=sh scripts/*.sh .github/scripts/*.sh && actionlint
      - run: echo '7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172  android/gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -
      - if: github.ref_type == 'tag'
        run: test "${GITHUB_REF_NAME#v}" = "$(sed -n 's/^version = \"\\([^\"]*\\)\"$/\\1/p' addon/plugin.cfg)"

  build_apple:
    name: Build Apple
    needs: preflight
    if: needs.preflight.outputs.run_heavy == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/build-apple

  build_windows:
    name: Build Windows
    needs: preflight
    if: needs.preflight.outputs.run_heavy == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/build-windows

  build_linux:
    name: Build Linux
    needs: preflight
    if: needs.preflight.outputs.run_heavy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/build-linux

  build_android:
    name: Build Android
    needs: preflight
    if: needs.preflight.outputs.run_heavy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/build-android

  assemble_addon:
    name: Assemble addon
    needs: [ build_apple, build_windows, build_linux, build_android ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: secure-storage-module-*
          path: ${{ runner.temp }}/modules
          merge-multiple: true
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package/addons/SecureStorage/bin
          cp addon/plugin.cfg addon/plugin.gd addon/export_plugin.gd \
            addon/secure_storage.gd addon/secure_storage.gdextension addon/icon.svg \
            dist/package/addons/SecureStorage/
          cp -R "$RUNNER_TEMP/modules/." dist/package/addons/SecureStorage/bin/
          find dist/package -type d -exec chmod 755 {} +
          find dist/package -type f -exec chmod 644 {} +
          find dist/package/addons/SecureStorage/bin/macos -type d -name '*.framework' |
            while IFS= read -r framework; do
              chmod 755 "$framework/$(basename "$framework" .framework)"
            done
          find dist/package -exec touch -t 198001010000 {} +
          (cd dist/package && find addons -print | LC_ALL=C sort | zip -X -q ../SecureStorage.zip -@)
          (cd dist && sha256sum SecureStorage.zip > SecureStorage.zip.sha256)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: secure-storage-candidate
          path: dist/SecureStorage.zip*

  e2e_macos:
    name: E2E macOS
    needs: assemble_addon
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/e2e-macos

  e2e_ios:
    name: E2E iOS Simulator
    needs: assemble_addon
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/e2e-ios

  e2e_windows:
    name: E2E Windows
    needs: assemble_addon
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/e2e-windows

  e2e_linux:
    name: E2E Linux
    needs: assemble_addon
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/e2e-linux

  e2e_android:
    name: E2E Android
    needs: assemble_addon
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/e2e-android

  ci_complete:
    name: CI complete
    if: always()
    needs: [ preflight, assemble_addon, e2e_macos, e2e_ios, e2e_windows, e2e_linux, e2e_android ]
    runs-on: ubuntu-24.04
    steps:
      - run: test '${{ needs.preflight.result }}' = success && if [ '${{ needs.preflight.outputs.run_heavy }}' = false ]; then test '${{ needs.assemble_addon.result }}' = skipped; else test '${{ needs.assemble_addon.result }}' = success && test '${{ needs.e2e_macos.result }}' = success && test '${{ needs.e2e_ios.result }}' = success && test '${{ needs.e2e_windows.result }}' = success && test '${{ needs.e2e_linux.result }}' = success && test '${{ needs.e2e_android.result }}' = success; fi

  release:
    name: Publish release
    needs: ci_complete
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.ci_complete.result == 'success'
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: secure-storage-candidate
          path: dist
      - run: cd dist && sha256sum -c SecureStorage.zip.sha256 && gh release create "$GITHUB_REF_NAME" SecureStorage.zip SecureStorage.zip.sha256 --verify-tag --title "SecureStorage ${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
