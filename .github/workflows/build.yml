name: Build all platforms

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.1-stable
  GODOT_CPP_COMMIT: ba0edfed90512ec64aba51d4295a3e7e30112f86
  SCONS_VERSION: 4.10.1

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate tag and addon version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "发布 tag 必须使用 v<major>.<minor>.<patch> 格式：$GITHUB_REF_NAME" >&2
            exit 1
          fi

          tag_version="${GITHUB_REF_NAME#v}"
          addon_version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' src/addon/plugin.cfg)
          if [ "$tag_version" != "$addon_version" ]; then
            echo "发布 tag 版本 $tag_version 与 plugin.cfg 版本 $addon_version 不一致" >&2
            exit 1
          fi

  apple:
    name: Apple arm64
    needs: validate
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read runner image version
        id: runner-image
        shell: bash
        run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Restore Apple dependency cache
        id: apple-dependency-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/secure-storage-build/deps
          key: secure-storage-apple-deps-${{ runner.arch }}-${{ steps.runner-image.outputs.version }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_CPP_COMMIT }}-${{ env.SCONS_VERSION }}-${{ hashFiles('scripts/bootstrap.sh') }}

      - name: Restore Apple object cache
        id: apple-object-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ runner.temp }}/secure-storage-build/obj
            ${{ runner.temp }}/secure-storage-build/scons-cache
            ${{ runner.temp }}/secure-storage-build/sconsign
          key: secure-storage-apple-obj-${{ runner.arch }}-${{ steps.runner-image.outputs.version }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_CPP_COMMIT }}-${{ env.SCONS_VERSION }}-${{ hashFiles('scripts/build.sh', 'src/SConstruct') }}-${{ hashFiles('src/native/**') }}
          restore-keys: |
            secure-storage-apple-obj-${{ runner.arch }}-${{ steps.runner-image.outputs.version }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_CPP_COMMIT }}-${{ env.SCONS_VERSION }}-${{ hashFiles('scripts/build.sh', 'src/SConstruct') }}-
            secure-storage-apple-obj-${{ runner.arch }}-${{ steps.runner-image.outputs.version }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_CPP_COMMIT }}-${{ env.SCONS_VERSION }}-

      - name: Install SCons
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/scons"
          "$RUNNER_TEMP/scons/bin/pip" install "scons==$SCONS_VERSION"
          echo "$RUNNER_TEMP/scons/bin" >> "$GITHUB_PATH"

      - name: Install Godot
        shell: bash
        run: |
          curl -fL "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/Godot_v${GODOT_VERSION}_macos.universal.zip" -o "$RUNNER_TEMP/godot.zip"
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/bin"
          ditto -x -k "$RUNNER_TEMP/godot.zip" "$RUNNER_TEMP/godot"
          ln -s "$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" "$RUNNER_TEMP/bin/godot"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Verify and test macOS
        shell: bash
        run: |
          ./scripts/verify.sh
          ./scripts/test.sh real
          ./scripts/build.sh macos template_release arm64

      - name: Build iOS
        shell: bash
        run: |
          ./scripts/build.sh ios template_debug arm64
          ./scripts/build.sh ios template_release arm64

      - name: Save Apple dependency cache
        if: steps.apple-dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/secure-storage-build/deps
          key: ${{ steps.apple-dependency-cache.outputs.cache-primary-key }}

      - name: Save Apple object cache
        if: steps.apple-object-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ runner.temp }}/secure-storage-build/obj
            ${{ runner.temp }}/secure-storage-build/scons-cache
            ${{ runner.temp }}/secure-storage-build/sconsign
          key: ${{ steps.apple-object-cache.outputs.cache-primary-key }}

      - name: Archive Apple outputs
        shell: bash
        run: tar -czf "$RUNNER_TEMP/apple.tar.gz" addons/SecureStorage/bin/macos addons/SecureStorage/bin/ios

      - name: Upload Apple outputs
        uses: actions/upload-artifact@v7
        with:
          name: secure-storage-apple
          path: ${{ runner.temp }}/apple.tar.gz
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x86_64
    needs: validate
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read runner image version
        id: runner-image
        shell: bash
        run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Restore Windows dependency cache
        id: windows-dependency-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/secure-storage-build/deps
          key: secure-storage-windows-deps-${{ runner.arch }}-${{ steps.runner-image.outputs.version }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_CPP_COMMIT }}-${{ env.SCONS_VERSION }}-${{ hashFiles('scripts/bootstrap.sh') }}

      - name: Restore Windows object cache
        id: windows-object-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ runner.temp }}/secure-storage-build/obj
            ${{ runner.temp }}/secure-storage-build/scons-cache
            ${{ runner.temp }}/secure-storage-build/sconsign
          key: secure-storage-windows-obj-${{ runner.arch }}-${{ steps.runner-image.outputs.version }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_CPP_COMMIT }}-${{ env.SCONS_VERSION }}-${{ hashFiles('scripts/build.sh', 'src/SConstruct') }}-${{ hashFiles('src/native/**') }}
          restore-keys: |
            secure-storage-windows-obj-${{ runner.arch }}-${{ steps.runner-image.outputs.version }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_CPP_COMMIT }}-${{ env.SCONS_VERSION }}-${{ hashFiles('scripts/build.sh', 'src/SConstruct') }}-
            secure-storage-windows-obj-${{ runner.arch }}-${{ steps.runner-image.outputs.version }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_CPP_COMMIT }}-${{ env.SCONS_VERSION }}-

      - name: Install SCons
        shell: pwsh
        run: |
          py -3 -m venv "$env:RUNNER_TEMP\scons"
          & "$env:RUNNER_TEMP\scons\Scripts\python.exe" -m pip install "scons==$env:SCONS_VERSION"
          "$env:RUNNER_TEMP\scons\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Godot
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP\godot.zip"
          $directory = "$env:RUNNER_TEMP\godot"
          $version = $env:GODOT_VERSION
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/$version/Godot_v${version}_win64.exe.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $directory
          $godot = (Get-ChildItem $directory -Filter "Godot*.exe" | Select-Object -First 1).FullName
          "GODOT_BIN=$godot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and test Windows DPAPI backend
        shell: bash
        run: |
          ./scripts/test.sh real
          ./scripts/build.sh windows template_release x86_64

      - name: Save Windows dependency cache
        if: steps.windows-dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/secure-storage-build/deps
          key: ${{ steps.windows-dependency-cache.outputs.cache-primary-key }}

      - name: Save Windows object cache
        if: steps.windows-object-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ runner.temp }}/secure-storage-build/obj
            ${{ runner.temp }}/secure-storage-build/scons-cache
            ${{ runner.temp }}/secure-storage-build/sconsign
          key: ${{ steps.windows-object-cache.outputs.cache-primary-key }}

      - name: Archive Windows outputs
        shell: pwsh
        run: tar -czf "$env:RUNNER_TEMP/windows.tar.gz" addons/SecureStorage/bin/windows

      - name: Upload Windows outputs
        uses: actions/upload-artifact@v7
        with:
          name: secure-storage-windows
          path: ${{ runner.temp }}/windows.tar.gz
          if-no-files-found: error
          retention-days: 7

  linux_android:
    name: Linux and Android
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read runner image version
        id: runner-image
        shell: bash
        run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Restore Linux dependency cache
        id: linux-dependency-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/secure-storage-build/deps
          key: secure-storage-linux-deps-${{ runner.arch }}-${{ steps.runner-image.outputs.version }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_CPP_COMMIT }}-${{ env.SCONS_VERSION }}-${{ hashFiles('scripts/bootstrap.sh') }}-complete
          restore-keys: |
            secure-storage-linux-deps-${{ runner.arch }}-${{ steps.runner-image.outputs.version }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_CPP_COMMIT }}-${{ env.SCONS_VERSION }}-${{ hashFiles('scripts/bootstrap.sh') }}-

      - name: Restore Linux object cache
        id: linux-object-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ runner.temp }}/secure-storage-build/obj
            ${{ runner.temp }}/secure-storage-build/scons-cache
            ${{ runner.temp }}/secure-storage-build/sconsign
          key: secure-storage-linux-obj-${{ runner.arch }}-${{ steps.runner-image.outputs.version }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_CPP_COMMIT }}-${{ env.SCONS_VERSION }}-${{ hashFiles('scripts/build.sh', 'src/SConstruct') }}-${{ hashFiles('src/native/**') }}-complete
          restore-keys: |
            secure-storage-linux-obj-${{ runner.arch }}-${{ steps.runner-image.outputs.version }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_CPP_COMMIT }}-${{ env.SCONS_VERSION }}-${{ hashFiles('scripts/build.sh', 'src/SConstruct') }}-${{ hashFiles('src/native/**') }}-
            secure-storage-linux-obj-${{ runner.arch }}-${{ steps.runner-image.outputs.version }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_CPP_COMMIT }}-${{ env.SCONS_VERSION }}-${{ hashFiles('scripts/build.sh', 'src/SConstruct') }}-
            secure-storage-linux-obj-${{ runner.arch }}-${{ steps.runner-image.outputs.version }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_CPP_COMMIT }}-${{ env.SCONS_VERSION }}-

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install native build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-daemon gnome-keyring libsecret-1-dev libsecret-tools openssl pkg-config python3-venv unzip
          python3 -m venv "$RUNNER_TEMP/scons"
          "$RUNNER_TEMP/scons/bin/pip" install "scons==$SCONS_VERSION"
          echo "$RUNNER_TEMP/scons/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" \
            "platforms;android-36" \
            "ndk;28.1.13356709" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.1.13356709" >> "$GITHUB_ENV"

      - name: Install Godot
        shell: bash
        run: |
          curl -fL "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/bin"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          godot_binary=$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot*' -print -quit)
          chmod +x "$godot_binary"
          ln -s "$godot_binary" "$RUNNER_TEMP/bin/godot"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build Linux debug
        timeout-minutes: 30
        shell: bash
        env:
          SCONSFLAGS: --jobs=2
        run: ./scripts/build.sh linux template_debug x86_64

      - name: Save Linux debug dependency cache
        if: steps.linux-dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/secure-storage-build/deps
          key: ${{ steps.linux-dependency-cache.outputs.cache-primary-key }}-debug-${{ github.run_id }}

      - name: Save Linux debug object cache
        if: steps.linux-object-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ runner.temp }}/secure-storage-build/obj
            ${{ runner.temp }}/secure-storage-build/scons-cache
            ${{ runner.temp }}/secure-storage-build/sconsign
          key: ${{ steps.linux-object-cache.outputs.cache-primary-key }}-debug-${{ github.run_id }}

      - name: Test Linux Secret Service backend
        shell: bash
        env:
          SECURE_STORAGE_TEST_SKIP_BUILD: "1"
          SECURE_STORAGE_TEST_TIMEOUT: 10m
        run: |
          dbus-run-session -- bash -euo pipefail <<'EOF'
          keyring_password=$(openssl rand -hex 32)
          printf '%s' "$keyring_password" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
          unset keyring_password

          preflight_value=secure-storage-ci-preflight
          cleanup_preflight() {
            timeout 30s secret-tool clear application secure-storage-ci key preflight >/dev/null 2>&1 || true
          }
          trap cleanup_preflight EXIT
          printf '%s' "$preflight_value" | timeout 30s secret-tool store \
            --label="SecureStorage CI preflight" application secure-storage-ci key preflight
          stored_value=$(timeout 30s secret-tool lookup application secure-storage-ci key preflight)
          test "$stored_value" = "$preflight_value"
          cleanup_preflight
          trap - EXIT

          ./scripts/test.sh real
          EOF

      - name: Build Linux release
        timeout-minutes: 30
        shell: bash
        env:
          SCONSFLAGS: --jobs=2
        run: ./scripts/build.sh linux template_release x86_64

      - name: Build Android
        shell: bash
        env:
          SCONSFLAGS: --jobs=2
        run: |
          ./scripts/build.sh android template_debug arm64
          ./scripts/build.sh android template_release arm64

      - name: Save complete Linux and Android dependency cache
        if: steps.linux-dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/secure-storage-build/deps
          key: ${{ steps.linux-dependency-cache.outputs.cache-primary-key }}

      - name: Save complete Linux object cache
        if: steps.linux-object-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ runner.temp }}/secure-storage-build/obj
            ${{ runner.temp }}/secure-storage-build/scons-cache
            ${{ runner.temp }}/secure-storage-build/sconsign
          key: ${{ steps.linux-object-cache.outputs.cache-primary-key }}

      - name: Archive Linux and Android outputs
        shell: bash
        run: tar -czf "$RUNNER_TEMP/linux-android.tar.gz" addons/SecureStorage/bin/linux addons/SecureStorage/bin/android

      - name: Upload Linux and Android outputs
        uses: actions/upload-artifact@v7
        with:
          name: secure-storage-linux-android
          path: ${{ runner.temp }}/linux-android.tar.gz
          if-no-files-found: error
          retention-days: 7

  package:
    name: Verify and assemble addon
    needs:
      - apple
      - windows
      - linux_android
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download platform outputs
        uses: actions/download-artifact@v8
        with:
          pattern: secure-storage-*
          path: build-artifacts

      - name: Merge and verify outputs
        shell: bash
        run: |
          for archive in build-artifacts/*/*.tar.gz; do
            tar -xzf "$archive"
          done

          required_paths=(
            addons/SecureStorage/bin/macos/libsecure_storage.macos.template_debug.framework
            addons/SecureStorage/bin/macos/libsecure_storage.macos.template_release.framework
            addons/SecureStorage/bin/windows/secure_storage.windows.template_debug.x86_64.dll
            addons/SecureStorage/bin/windows/secure_storage.windows.template_release.x86_64.dll
            addons/SecureStorage/bin/linux/libsecure_storage.linux.template_debug.x86_64.so
            addons/SecureStorage/bin/linux/libsecure_storage.linux.template_release.x86_64.so
            addons/SecureStorage/bin/android/debug/SecureStorage-debug.aar
            addons/SecureStorage/bin/android/release/SecureStorage-release.aar
            addons/SecureStorage/bin/ios/libsecure_storage.ios.template_debug.xcframework
            addons/SecureStorage/bin/ios/libsecure_storage.ios.template_release.xcframework
            addons/SecureStorage/bin/ios/libgodot-cpp.ios.template_debug.xcframework
            addons/SecureStorage/bin/ios/libgodot-cpp.ios.template_release.xcframework
          )
          for required_path in "${required_paths[@]}"; do
            test -e "$required_path"
          done

          stage="$RUNNER_TEMP/release/addons/SecureStorage"
          mkdir -p "$stage/bin"
          for addon_file in plugin.cfg plugin.gd export_plugin.gd storage_service.gd secure_storage.gdextension icon.svg; do
            cp "src/addon/$addon_file" "$stage/$addon_file"
          done
          cp -R addons/SecureStorage/bin/. "$stage/bin/"
          cp -R docs "$stage/docs"
          cp LICENSE "$stage/LICENSE"

          mkdir -p dist
          package_version="${GITHUB_SHA:0:12}"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            package_version="${GITHUB_REF_NAME#v}"
          fi

          archive_name="SecureStorage-${package_version}.zip"
          archive="dist/$archive_name"
          (cd "$RUNNER_TEMP/release" && zip -q -r "$GITHUB_WORKSPACE/$archive" addons)
          (
            cd dist
            unzip -tq "$archive_name"
            sha256sum "$archive_name" > "$archive_name.sha256"
            sha256sum -c "$archive_name.sha256"
          )

      - name: Upload complete addon
        uses: actions/upload-artifact@v7
        with:
          name: SecureStorage-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download complete addon
        uses: actions/download-artifact@v8
        with:
          name: SecureStorage-${{ github.sha }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          (
            cd dist
            unzip -tq ./*.zip
            sha256sum -c ./*.sha256
          )

          gh release create "$GITHUB_REF_NAME" \
            dist/*.zip \
            dist/*.sha256 \
            --verify-tag \
            --title "SecureStorage ${GITHUB_REF_NAME#v}" \
            --generate-notes
