name: Build Android
description: Build and upload the Android AAR artifact.

runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
      with:
        distribution: temurin
        java-version: "17"

    - name: Cache Gradle
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ runner.temp }}/secure-storage-build/gradle-home/caches
          ${{ runner.temp }}/secure-storage-build/gradle-home/wrapper
        key: secure-storage-gradle-8.14.3-jdk17-linux

    - name: Install Android SDK
      shell: bash
      run: ./.github/scripts/setup-android-sdk.sh

    - name: Build Android module
      shell: bash
      run: ./scripts/build_android.sh

    - name: Upload Android module
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: secure-storage-module-android
        path: addon/bin
